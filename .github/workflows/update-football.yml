name: Ažuriranje fudbalskih podataka

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ažuriraj fudbalske podatke
        run: node scripts/update-football.js

      - name: Proveri da li ima promena
        id: changes
        run: |
          if git diff --quiet data/football.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sačuvaj nove podatke
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "FK Obilić Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/football.json
          git commit -m "Automatsko ažuriranje fudbalskih podataka"
          git push