name: Ažuriranje fudbalskih podataka

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ažuriraj fudbalske podatke
        run: node scripts/update-football.js

      - name: Sačuvaj nove podatke
        run: |
          git config user.name "FK Obilić Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/football.json

          if git diff --cached --quiet; then
            echo "Nema promena u fudbalskim podacima."
          else
            git commit -m "Automatsko ažuriranje fudbalskih podataka"
            git push
          fi